<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142641">
<title>Zielski.info</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#070e17;color:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,a,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-underline-offset:.3em}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ffda8c;outline-offset:5px}
.sky,.terminal{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(24px,5vw,74px);gap:28px}
.sky{background:radial-gradient(ellipse at 78% 70%,#946175 0%,transparent 42%),linear-gradient(154deg,#0b1933 12%,#273d61 49%,#694f6b 76%,#ee9b80 100%)}
.clouds{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.85}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080f23a8,transparent 80%),linear-gradient(0deg,#090f19dd,transparent 43%);z-index:-1}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:.85rem}
.brand{font-weight:750;letter-spacing:.1em;text-decoration:none}
.hero{align-self:center;padding:36px 0 54px}
h1{font-size:clamp(3rem,8.8vw,8.4rem);line-height:.94;letter-spacing:-.075em;margin:0 0 36px;font-weight:760}
h1 span{color:#ffded4}
.pill,.back,.hint button,form button{border:1px solid currentColor;border-radius:999px;padding:12px 17px;background:#0b1228b8;color:inherit}
.pill{display:inline-flex;align-items:center;gap:10px;border-color:#ff9c9b}
.pill::before{content:"";width:25px;height:13px;border-radius:50px;background:linear-gradient(125deg,#ff878a 5%,#d7284f 47%,#8d1730 51%,#f63f62 100%);box-shadow:0 0 14px #ff346c88;transform:rotate(-25deg)}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pill.blue{border-color:#9fc8ff}
.pill.blue::before{background:linear-gradient(125deg,#a9d7ff 5%,#356cdd 47%,#204394 51%,#5a9aff 100%);box-shadow:0 0 14px #5a9aff88}
.sky-note{min-height:3em;margin:16px 0 0;line-height:1.5;color:#d9eaff}
.console-title .cursor{display:inline-block;width:.62em;height:1em;margin-left:.55em;vertical-align:-.16em;background:currentColor;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.console-title .cursor{animation:none}}
.terminal{font-family:ui-monospace,monospace;background:#05100b;color:#a8ffbd}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.37}
.console{width:min(100%,850px);align-self:center;justify-self:center;background:#07150fef;border:1px solid #4ba26a;border-radius:12px;box-shadow:0 0 80px #47ea7022;overflow:hidden}
.console-title{padding:15px 20px;border-bottom:1px solid #306343;background:#10251b;font-size:.82rem}
.console-title::before{content:"●";margin-right:12px;color:#75ffa0}
.console-body{padding:clamp(16px,4vw,38px)}
.console h2{font-size:clamp(1.3rem,4vw,2.2rem);margin:0 0 20px}
#output{overflow-wrap:anywhere;white-space:pre-wrap;min-height:3em;line-height:1.6}
form{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
input{min-width:0;width:100%;background:#020a05;color:#cfffda;border:1px solid #4ba26a;border-radius:5px;padding:11px}
.back,.hint button,form button{background:#10251b;color:#a8ffbd}
form button{border-radius:5px}
.hint{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:.8rem}
.hint button{padding:7px 12px}
@media(max-width:460px){form label{display:none}form{grid-template-columns:minmax(0,1fr) auto}.back{font-size:.75rem}}
</style>
</head>
<body>
<section class="sky" id="sky" aria-label="Strona główna">
<img class="clouds" src="clouds.webp" alt="">
<header><a class="brand" href="./">ZIELSKI.INFO</a></header>
<main class="hero">
<h1>Umiesz liczyć,<br><span>licz na siebie.</span></h1>
<div class="pills">
<button class="pill" id="enter" type="button">Czerwona pigułka</button>
<button class="pill blue" id="blue" type="button">Niebieska pigułka</button>
</div>
<p class="sky-note" id="sky-note" role="status"></p>
</main>
<footer><span>Zielski.info</span></footer>
</section>
<section class="terminal" id="terminal" aria-label="Tryb terminala" hidden>
<canvas aria-hidden="true"></canvas>
<header><span class="brand">ZIELSKI.INFO</span><button class="back" id="back" type="button">Wróć na powierzchnię</button></header>
<div class="console">
<div class="console-title">login:<span class="cursor" aria-hidden="true"></span></div>
<div class="console-body">
<h2>Umiesz liczyć, licz na siebie.</h2>
<p id="output" role="status">Połączenie nawiązane. Wpisz help, aby zobaczyć polecenia.</p>
<form id="command">
<label for="input">❯</label>
<input id="input" aria-label="Polecenie terminala" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Wpisz polecenie">
<button type="submit">Wyślij</button>
</form>
<div class="hint"><button id="help" type="button">help</button><button id="clear" type="button">clear</button></div>
</div>
</div>
<footer><span>Sesja lokalna</span></footer>
</section>
<script>
const sky = document.querySelector('#sky');
const terminal = document.querySelector('#terminal');
const enter = document.querySelector('#enter');
const back = document.querySelector('#back');
const input = document.querySelector('#input');
const output = document.querySelector('#output');
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const characters = '01アカサタナハマヤラワイキシチニヒミリ';
const initialMessage = output.textContent;
let rain;
let drops = [];
let width;
let height;

function resizeRain() {
  const bounds = canvas.getBoundingClientRect();
  const scale = Math.min(devicePixelRatio, 2);
  width = bounds.width;
  height = bounds.height;
  canvas.width = width * scale;
  canvas.height = height * scale;
  context.setTransform(scale, 0, 0, scale, 0, 0);
  drops = Array.from({length: Math.ceil(width / 19)}, () => Math.random() * height / 19);
}
function drawRain() {
  context.fillStyle = '#05100b24';
  context.fillRect(0, 0, width, height);
  context.font = '15px monospace';
  context.fillStyle = '#6aff9a';
  drops.forEach((row, column) => {
    const character = characters[Math.floor(Math.random() * characters.length)];
    context.fillText(character, column * 19, row * 19);
    drops[column] = row * 19 > height && Math.random() > .97 ? 0 : row + 1;
  });
}
function updateRain() {
  clearInterval(rain);
  if (!terminal.hidden) {
    resizeRain();
    const frames = reducedMotion.matches ? 18 : 1;
    for (let frame = 0; frame < frames; frame += 1) drawRain();
    if (!reducedMotion.matches) rain = setInterval(drawRain, 70);
  }
}
function showTerminal(isOpen) {
  sky.hidden = isOpen;
  terminal.hidden = !isOpen;
  updateRain();
  if (isOpen) back.focus();
  else enter.focus();
}
function runCommand(command) {
  switch (command) {
    case 'help':
      output.textContent = 'help   — polecenia\nclear  — wyczyść ekran\nexit   — wróć na powierzchnię\n\nWskazówka: w jakim filmie wybrano czerwoną pigułkę?';
      break;
    case 'matrix':
      output.textContent = 'Umiesz liczyć, licz na siebie,\n' + new TextDecoder().decode(Uint8Array.from(atob('dHdvamUgc3pjesSZxZtjaWUgaW5ueWNoIGoqKipl'), character => character.charCodeAt(0)));
      break;
    case 'clear':
      output.textContent = '';
      break;
    case 'exit':
      output.textContent = initialMessage;
      showTerminal(false);
      break;
    default:
      output.textContent = 'Nieznane polecenie. Wpisz help.';
  }
}
const skyNote = document.querySelector('#sky-note');
document.querySelector('#blue').addEventListener('click', () => {
  skyNote.textContent = 'Zostajesz nad chmurami. Dziś jedyny błąd systemu to pogoda.';
});
enter.addEventListener('click', () => {
  skyNote.textContent = '';
  showTerminal(true);
});
back.addEventListener('click', () => runCommand('exit'));
document.querySelector('#help').addEventListener('click', () => runCommand('help'));
document.querySelector('#clear').addEventListener('click', () => runCommand('clear'));
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  const command = input.value.trim().toLowerCase();
  input.value = '';
  if (command) runCommand(command);
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !terminal.hidden) runCommand('exit');
});
window.addEventListener('resize', updateRain);
reducedMotion.addEventListener('change', updateRain);
</script>
</body>
</html>
